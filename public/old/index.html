<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tobi's Impostergame</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="margin-top:40px;">

  <div class="bigCard" style="margin-bottom:20px;">
    <h1 style="margin:0; font-size:28px;">Tobi's Impostergame</h1>
    <div class="small" style="margin-top:6px;">
      Wer ist der Imposter? Du oder deine Freunde?
    </div>
  </div>

  <div class="card" style="text-align:center; padding:22px;">
    <p style="font-size:17px; margin-bottom:20px;">
      Starte ein neues Spiel als Host oder tritt einem bestehenden Spiel als Spieler bei.
    </p>

    <!-- Buttons: URLs zu Render -->
    <button class="btn" style="width:100%; margin-bottom:12px;"
            onclick="window.location.href='https://DEIN-RENDER-SERVICE.onrender.com/host.html'">
      Spiel hosten
    </button>

    <button class="btn ghost" style="width:100%;"
            onclick="window.location.href='https://DEIN-RENDER-SERVICE.onrender.com/player.html'">
      Spiel beitreten
    </button>
  </div>

</div>

</body>
</html>
